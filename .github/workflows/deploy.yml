name: Deploy Portfolio to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Compress files
        run: tar -czf portfolio.tar.gz css gif img js index.html

      - name: Upload archive to server
        run: |
          scp -P $SSH_PORT portfolio.tar.gz $SSH_USER@$SSH_HOST:$SSH_TARGET_DIR/portfolio.tar.gz

      - name: Deploy to VPS
        run: |
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "
            cd $SSH_TARGET_DIR && \
            tar -xzf portfolio.tar.gz && \
            rm portfolio.tar.gz && \
            pm2 delete portfolio || true && \
            pm2 serve . 3050 --name portfolio --spa
          "
